  # -------------------------------------------------------- validacao_microdado
  - nome: validacao_microdado_chave_duplicada
    tabela: validacao_microdado
    severidade: bloqueante
    operador: "="
    limiar: 0
    descricao: Uma linha por (nivel, ano, rede, UF, município).
    sql: >-
      SELECT COUNT(*) - COUNT(DISTINCT FORMAT('%s|%d|%s|%s|%s', nivel, ano, rede_padrao,
        IFNULL(sigla_uf, 'BR'), IFNULL(id_municipio, '-')))
      FROM {tabela}

  - nome: validacao_microdado_taxa_fora_0_100
    tabela: validacao_microdado
    severidade: bloqueante
    operador: "="
    limiar: 0
    descricao: Taxa recalculada é percentual.
    sql: SELECT COUNTIF(taxa_recalculada < 0 OR taxa_recalculada > 100) FROM {tabela}

  - nome: validacao_microdado_match_uf
    tabela: validacao_microdado
    severidade: bloqueante
    operador: "<="
    limiar: 3
    descricao: >-
      Linhas de UF publicadas sem microdado (falha do join resultado_uf -> microdados).
      Medido: 3 de 145 (97,9%), todas de SP 2023, que não está em alunos na fonte
      (docs/investigacao.md §10). Limiar em contagem: qualquer linha a mais reprova;
      uma chave quebrada levaria a contagem para perto de 145.
    sql: >-
      SELECT COUNTIF(NOT tem_microdado) FROM {tabela}
      WHERE nivel = 'uf' AND tem_publicada

  - nome: validacao_microdado_match_municipio
    tabela: validacao_microdado
    severidade: bloqueante
    operador: "<="
    limiar: 802
    descricao: >-
      Linhas de município publicadas sem microdado. Medido: 802 de 23.995 (96,7%): 801 de
      SP 2023 e 1 da PB 2024, rede estadual (§10).
    sql: >-
      SELECT COUNTIF(NOT tem_microdado) FROM {tabela}
      WHERE nivel = 'municipio' AND tem_publicada

  - nome: validacao_microdado_uf_concordancia
    tabela: validacao_microdado
    severidade: informativa
    operador: ">="
    limiar: 0.95
    descricao: Proporção de UF × ano × rede em que a taxa recalculada fica a até 0,5 p.p. da publicada.
    sql: >-
      SELECT SAFE_DIVIDE(COUNTIF(ABS(diferenca_pp) <= 0.5), COUNTIF(diferenca_pp IS NOT NULL))
      FROM {tabela} WHERE nivel = 'uf'

  - nome: validacao_microdado_uf_maior_diferenca
    tabela: validacao_microdado
    severidade: informativa
    operador: "<="
    limiar: 1.5
    descricao: >-
      Maior diferença absoluta (p.p.) entre recalculada e publicada no nível UF. Medido:
      1,49 (MT 2023, rede estadual, 2.818 avaliados); em 2024, no máximo 0,70 (PB estadual).
    sql: SELECT MAX(ABS(diferenca_pp)) FROM {tabela} WHERE nivel = 'uf'

  - nome: validacao_microdado_brasil_2024
    tabela: validacao_microdado
    severidade: bloqueante
    operador: "<="
    limiar: 0.05
    descricao: >-
      A taxa nacional de 2024 (rede pública), recalculada dos microdados com peso amostral
      e só sobre avaliados, precisa bater com a oficial (59,2). Medido: 59,20, diferença 0,00.
      É a verificação de ponta a ponta da pipeline: um erro de filtro, peso ou denominador
      em qualquer camada muda este número.
    sql: >-
      SELECT ABS(diferenca_pp) FROM {tabela}
      WHERE nivel = 'brasil' AND ano = 2024 AND rede_padrao = 'publica'

  - nome: validacao_microdado_brasil_2023
    tabela: validacao_microdado
    severidade: informativa
    operador: "<="
    limiar: 1.56
    descricao: >-
      Diferença nacional de 2023. Medido: 1,56 p.p. (57,46 recalculada sem SP contra
      55,9 oficial). SP explica cerca de 1,1 p.p. (§10).
    sql: >-
      SELECT ABS(diferenca_pp) FROM {tabela}
      WHERE nivel = 'brasil' AND ano = 2023 AND rede_padrao = 'publica'

